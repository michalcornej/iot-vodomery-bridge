name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: vodomery
          POSTGRES_USER: vodomery
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vodomery"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DB: "1"
      DB_HOST: localhost
      DB_NAME: vodomery
      DB_USER: vodomery
      DB_PASSWORD: ci-password
      PGPASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: DB schema
        run: psql -h localhost -U vodomery -d vodomery -v ON_ERROR_STOP=1 -f db/init.sql
      - name: Tests
        run: pytest -v
